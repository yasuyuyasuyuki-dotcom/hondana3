            <div id="detail-phrases" class="flex flex-col gap-2 max-h-48 overflow-y-auto mb-2"></div>
            <div id="detail-phrase-add" class="flex gap-2">
              <input type="text" id="detail-phrase-text" placeholder="フレーズをすばやく追加" class="flex-1 bg-stone-50 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-stone-200 font-serif-jp">
              <input type="number" id="detail-phrase-page" placeholder="p." class="w-16 bg-stone-50 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-stone-200">
              <button id="btn-detail-phrase" class="px-3 rounded-lg bg-stone-100 hover:bg-stone-200 transition" title="追加"><i class="ph ph-plus"></i></button>
            </div>
          </div>

          <div id="detail-actions" class="flex gap-3 pt-4 border-t border-stone-100 mt-auto">
            <button id="btn-delete-book" class="px-4 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition">削除</button>
            <div class="flex-1"></div>
            <button id="btn-cancel-book" class="px-4 py-2 rounded-lg text-sm text-stone-500 hover:bg-stone-100 transition">キャンセル</button>
            <button id="btn-save-book" class="px-6 py-2 rounded-lg bg-stone-900 hover:bg-stone-700 text-white text-sm font-medium transition">保存</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] flex flex-col items-center gap-2 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDQX0UKzhphBOX7-tfFINgvCVIQa9qyw4",
      authDomain: "hondana-aa5c1.firebaseapp.com",
      projectId: "hondana-aa5c1",
      storageBucket: "hondana-aa5c1.firebasestorage.app",
      messagingSenderId: "700740460084",
      appId: "1:700740460084:web:67835a45372862deb4b461",
      measurementId: "G-M5FDTEZN1T"
    };

    /* ================= ユーティリティ ================= */
    const $ = (id) => document.getElementById(id);
    const generateId = () => Math.random().toString(36).slice(2, 11);
    const esc = (v) => (v === undefined || v === null) ? '' : String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    const hashStr = (s) => { let h = 0; for (const ch of String(s)) { h = ((h << 5) - h) + ch.charCodeAt(0); h |= 0; } return Math.abs(h); };
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const genreOf = (b) => (b && b.genre && String(b.genre).trim()) ? String(b.genre).trim() : '未分類';
    const clean = (obj) => JSON.parse(JSON.stringify(obj));
    const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

    // 布装の本をイメージした色
    const PALETTE = [
      { bg: '#2f3e46', fg: '#f1ece2' }, { bg: '#7b2d26', fg: '#f6e9d8' }, { bg: '#3d5a40', fg: '#eef0e2' },
      { bg: '#d8ccb4', fg: '#2b2620' }, { bg: '#1f2a44', fg: '#e9e4d6' }, { bg: '#9c6b30', fg: '#fbf3e4' },
      { bg: '#5b4b6b', fg: '#f0eaf4' }, { bg: '#e9e2d3', fg: '#3a3128' }, { bg: '#b5523b', fg: '#fff4ea' },
      { bg: '#365b6d', fg: '#eaf1f3' }, { bg: '#c9a227', fg: '#2a2410' }, { bg: '#4a4a48', fg: '#eeeae2' },
      { bg: '#a3b18a', fg: '#26301e' }, { bg: '#f2efe9', fg: '#2b2b2b' }, { bg: '#6d2e46', fg: '#f7e8ee' }
    ];
    const colorFor = (b) => PALETTE[hashStr((b.title || '') + '|' + (b.author || '')) % PALETTE.length];

    function coverHtml(b, extraClass = '') {
      const c = colorFor(b);
      const img = b.coverUrl ? `<img src="${esc(b.coverUrl)}" alt="" loading="lazy" onerror="this.remove()">` : '';
      return `<div class="cover ${extraClass}">
        <div class="gen-cover" style="background:${c.bg};color:${c.fg}">
          <div><div class="gc-title">${esc(b.title || '無題')}</div><div class="gc-rule"></div></div>
          <div class="gc-author">${esc(b.author || '')}</div>
        </div>${img}</div>`;
    }

    function showToast(message, type = 'success') {
      const icons = {
        success: '<i class="ph-fill ph-check-circle text-green-600 text-lg"></i>',
        error: '<i class="ph-fill ph-warning-circle text-red-500 text-lg"></i>',
        info: '<i class="ph-fill ph-info text-stone-500 text-lg"></i>'
      };
      const el = document.createElement('div');
      el.className = 'toast flex items-center gap-2 bg-white px-4 py-3 rounded-xl shadow-lg border border-stone-100 text-sm font-medium';
      el.innerHTML = `${icons[type] || icons.info}<span>${esc(message)}</span>`;
      $('toast-container').appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2800);
    }

    // 画像を表紙サイズに縮小して dataURL にする(Firestoreの容量対策)
    function resizeImage(file, maxW = 200, maxH = 300) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(maxW / img.width, maxH / img.height, 1);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /* ================= 状態 ================= */
    const safeLS = {
      get(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch { return fb; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
      remove(k) { try { localStorage.removeItem(k); } catch {} }
    };

    const state = {
      books: [], links: [], phrases: [],
      filter: 'all', genre: 'all', query: '', sort: safeLS.get('hondana_sort', 'shelf'),
      viewMode: safeLS.get('hondana_view', 'spine'),
      phrasesGenre: 'all', phrasesQuery: '',
      activeTab: 'bookshelf',
      isPortfolioMode: false, portfolioOwner: '',
      isConnectMode: false, connectSourceId: null,
      selectedBookId: null, draftCover: '', draftRating: 0, draftStatus: 'wish',
      editingPhraseId: null
    };

    let app, db, auth, currentUser = null;
    const provider = new GoogleAuthProvider();

    /* ================= 認証・データ ================= */
    async function initApp() {
      const portfolioId = new URLSearchParams(location.search).get('portfolio');
      if (portfolioId) enterPortfolioMode();
      try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        if (portfolioId) {
          await loadPortfolio(portfolioId);
          renderAll();
          return;
        }
        onAuthStateChanged(auth, async (user) => {
          currentUser = user || null;
          updateAuthUI(currentUser);
          if (currentUser) await syncLocalToCloud();
          await loadData();
          renderAll();
        });
      } catch (e) {
        console.error('Firebase init error:', e);
        loadLocalData();
        renderAll();
      }
    }

    function enterPortfolioMode() {
      state.isPortfolioMode = true;
      ['btn-add-book', 'btn-share', 'auth-container', 'phrase-form-container', 'btn-connect-mode'].forEach(id => $(id).classList.add('hidden'));
      $('portfolio-banner').classList.remove('hidden');
      $('map-hint').textContent = '本と本のつながりを星座として眺められます。';
    }

    async function loadPortfolio(id) {
      try {
        const snap = await getDoc(doc(db, 'portfolios', id));
        if (!snap.exists()) { showToast('共有された本棚が見つかりません', 'error'); return; }
        const data = snap.data();
        state.books = (data.books || []).map(normalizeBook);
        state.links = data.links || [];
        state.phrases = data.phrases || [];
        state.portfolioOwner = data.ownerName || '';
        if (state.portfolioOwner) {
          $('portfolio-banner-text').innerHTML = `<i class="ph ph-eye"></i>${esc(state.portfolioOwner)} さんの本棚を閲覧しています`;
        }
      } catch (e) {
        console.error(e);
        showToast('共有データを読み込めませんでした', 'error');
      }
    }

    $('btn-login').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        showToast('ログインしました');
      } catch (e) {
        console.error('Login failed', e);
        showToast('ログインに失敗しました', 'error');
      }
    });

    $('btn-logout').addEventListener('click', async () => {
      if (!confirm('ログアウトしますか？')) return;
      try {
        await signOut(auth);
        location.reload();
      } catch { showToast('ログアウトに失敗しました', 'error'); }
    });

    function updateAuthUI(user) {
      $('btn-login').classList.toggle('hidden', !!user);
      $('btn-login').classList.toggle('flex', !user);
      $('user-info').classList.toggle('hidden', !user);
      $('user-info').classList.toggle('flex', !!user);
      if (user) {
        const initial = user.displayName ? encodeURIComponent(user.displayName.charAt(0)) : 'U';
        $('user-avatar').src = user.photoURL || `https://placehold.co/100x100/e7e5e4/57534e?text=${initial}`;
        $('user-avatar').title = user.displayName || 'ユーザー';
      }
    }

    function normalizeBook(b) {
      return {
        id: b.id || generateId(),
        title: b.title || '無題',
        author: b.author || '',
        coverUrl: b.coverUrl || '',
        pages: parseInt(b.pages, 10) || 250,
        currentPage: (b.currentPage === undefined || b.currentPage === null) ? null : parseInt(b.currentPage, 10) || 0,
        status: ['read', 'reading', 'wish'].includes(b.status) ? b.status : 'read',
        rating: parseInt(b.rating, 10) || 0,
        memo: b.memo || '',
        startDate: b.startDate || '',
        endDate: b.endDate || '',
        genre: b.genre || '未分類',
        addedAt: b.addedAt || Date.now()
      };
    }

    async function syncLocalToCloud() {
      const localBooks = safeLS.get('hondana_books', []);
      const localLinks = safeLS.get('hondana_links', []);
      const localPhrases = safeLS.get('hondana_phrases', []);
      if (!localBooks.length && !localPhrases.length && !localLinks.length) return;
      showToast('この端末のデータをアカウントに同期しています...', 'info');
      try {
        const uid = currentUser.uid;
        const cloudIds = new Set((await getDocs(collection(db, 'users', uid, 'books'))).docs.map(d => d.id));
        for (const b of localBooks) if (!cloudIds.has(b.id)) await setDoc(doc(db, 'users', uid, 'books', b.id), clean(normalizeBook(b)));
        for (const p of localPhrases) await setDoc(doc(db, 'users', uid, 'phrases', p.id), clean(p));
        for (const l of localLinks) await setDoc(doc(db, 'users', uid, 'links', `${l.source}_${l.target}`), clean(l));
        ['hondana_books', 'hondana_links', 'hondana_phrases'].forEach(k => safeLS.remove(k));
        showToast('同期が完了しました');
      } catch (e) {
        console.error('Sync error', e);
        showToast('同期に失敗しました。時間をおいて再度お試しください', 'error');
      }
    }

    async function loadData() {
      if (!currentUser) { loadLocalData(); return; }
      try {
        const uid = currentUser.uid;
        const [bs, ls, ps] = await Promise.all([
          getDocs(collection(db, 'users', uid, 'books')),
          getDocs(collection(db, 'users', uid, 'links')),
          getDocs(collection(db, 'users', uid, 'phrases'))
        ]);
        state.books = bs.docs.map(d => normalizeBook({ id: d.id, ...d.data() }));
        state.links = ls.docs.map(d => d.data());
        state.phrases = ps.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.error('Failed to load cloud data', e);
        showToast('クラウドのデータを読み込めませんでした', 'error');
      }
    }

    function loadLocalData() {
      state.books = safeLS.get('hondana_books', []).map(normalizeBook);
      state.links = safeLS.get('hondana_links', []);
      state.phrases = safeLS.get('hondana_phrases', []);
    }

    function saveLocal() {
      if (currentUser || state.isPortfolioMode) return;
      safeLS.set('hondana_books', state.books);
      safeLS.set('hondana_links', state.links);
      safeLS.set('hondana_phrases', state.phrases);
    }

    const canWriteCloud = () => !state.isPortfolioMode && db && currentUser;
    async function cloudSet(col, id, data) {
      saveLocal();
      if (!canWriteCloud()) return;
      try { await setDoc(doc(db, 'users', currentUser.uid, col, id), clean(data)); }
      catch (e) { console.error(e); showToast('クラウドへの保存に失敗しました', 'error'); }
    }
    async function cloudDelete(col, id) {
      saveLocal();
      if (!canWriteCloud()) return;
      try { await deleteDoc(doc(db, 'users', currentUser.uid, col, id)); }
      catch (e) { console.error(e); showToast('クラウドからの削除に失敗しました', 'error'); }
    }
    const linkId = (l) => `${l.source}_${l.target}`;

    /* ================= 描画まとめ ================= */
    function renderAll() {
      renderStats();
      renderBookshelf();
      refreshActiveTab();
    }
    function refreshActiveTab() {
      if (state.activeTab === 'phrases') { renderPhraseBookSelect(); renderPhrases(); }
      else if (state.activeTab === 'mapping') renderMapping();
      else if (state.activeTab === 'serendipity') initSerendipityView();
    }

    /* ================= 読書の記録(統計) ================= */
    const finishDate = (b) => b.endDate ? new Date(b.endDate) : new Date(b.addedAt || Date.now());

    function renderStats() {
      const el = $('stats');
      if (!state.books.length) { el.innerHTML = ''; el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      const now = new Date();
      const y = now.getFullYear();
      const readThisYear = state.books.filter(b => b.status === 'read' && finishDate(b).getFullYear() === y);
      const months = Array(12).fill(0);
      readThisYear.forEach(b => months[finishDate(b).getMonth()]++);
      const pages = readThisYear.reduce((s, b) => s + (parseInt(b.pages, 10) || 0), 0);
      const max = Math.max(1, ...months);
      const reading = state.books.filter(b => b.status === 'reading');

      const bars = months.map((n, i) => `
        <div class="flex-1 flex flex-col items-center gap-1" title="${i + 1}月: ${n}冊">
          <div class="w-full flex items-end h-14">
            <div class="w-full rounded-sm ${i === now.getMonth() ? 'bg-stone-900' : 'bg-stone-300'}" style="height:${n ? Math.max(8, n / max * 100) : 3}%"></div>
          </div>
          <span class="text-[9px] ${i === now.getMonth() ? 'text-stone-900 font-semibold' : 'text-stone-400'}">${i + 1}</span>
        </div>`).join('');

      const readingHtml = reading.length ? reading.slice(0, 3).map(b => {
        const pct = b.pages ? clamp(Math.round((b.currentPage || 0) / b.pages * 100), 0, 100) : 0;
        return `<button data-open="${esc(b.id)}" class="flex items-center gap-3 w-full text-left hover:bg-stone-50 rounded-lg p-1 -m-1 transition">
          <div class="w-7 shrink-0">${coverHtml(b)}</div>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold truncate font-serif-jp">${esc(b.title)}</div>
            <div class="h-1 bg-stone-200 rounded-full mt-1.5 overflow-hidden"><div class="h-full bg-stone-800" style="width:${pct}%"></div></div>
          </div>
          <span class="text-[10px] text-stone-500 tabular-nums">${pct}%</span>
        </button>`;
      }).join('') : '<p class="text-xs text-stone-400 font-serif-jp">いま読んでいる本はありません</p>';

      el.innerHTML = `
        <div class="bg-white rounded-2xl border border-stone-200/70 p-4 flex flex-col justify-between">
          <span class="text-xs text-stone-400">${y}年に読んだ本</span>
          <div class="flex items-baseline gap-1 mt-1"><span class="text-4xl font-bold tabular-nums font-serif-jp">${readThisYear.length}</span><span class="text-sm text-stone-500">冊</span></div>
          <span class="text-xs text-stone-500 mt-1">${pages.toLocaleString()} ページ / 本棚に ${state.books.length} 冊</span>
        </div>
        <div class="bg-white rounded-2xl border border-stone-200/70 p-4 col-span-2 md:col-span-1 order-last md:order-none">
          <span class="text-xs text-stone-400">月ごとの読了</span>
          <div class="flex gap-1 mt-2">${bars}</div>
        </div>
        <div class="bg-white rounded-2xl border border-stone-200/70 p-4 flex flex-col gap-2.5">
          <span class="text-xs text-stone-400">読書中 ${reading.length ? `(${reading.length})` : ''}</span>
          ${readingHtml}
        </div>`;
    }

    /* ================= 本棚 ================= */
    function filteredBooks() {
      let list = state.books.slice();
      if (state.filter !== 'all') list = list.filter(b => b.status === state.filter);
      if (state.genre !== 'all') list = list.filter(b => genreOf(b) === state.genre);
      const q = state.query.trim().toLowerCase();
      if (q) list = list.filter(b => [b.title, b.author, b.genre, b.memo].some(v => (v || '').toLowerCase().includes(q)));
      const t = (d, fb) => { const v = d ? new Date(d).getTime() : NaN; return isNaN(v) ? fb : v; };
      const byTitle = (a, b) => (a.title || '').localeCompare(b.title || '', 'ja');
      switch (state.sort) {
        case 'recent': list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)); break;
        case 'finished': list.sort((a, b) => t(b.endDate, 0) - t(a.endDate, 0)); break;
        case 'title': list.sort(byTitle); break;
        case 'rating': list.sort((a, b) => (b.rating || 0) - (a.rating || 0) || byTitle(a, b)); break;
        case 'genre': list.sort((a, b) => genreOf(a).localeCompare(genreOf(b), 'ja') || byTitle(a, b)); break;
        default: list.sort((a, b) => t(a.startDate, a.addedAt || 0) - t(b.startDate, b.addedAt || 0));
      }
      return list;
    }

    function renderFilters() {
      const counts = { all: state.books.length, read: 0, reading: 0, wish: 0 };
      state.books.forEach(b => { if (counts[b.status] !== undefined) counts[b.status]++; });
      const labels = [['all', 'すべて'], ['read', '読了'], ['reading', '読書中'], ['wish', '読みたい']];
      $('status-filters').innerHTML = labels.map(([k, l]) => `
        <button data-filter="${k}" class="px-3 py-1 rounded-full transition whitespace-nowrap ${state.filter === k ? 'bg-white shadow-sm text-stone-900 font-medium' : 'text-stone-500 hover:text-stone-900'}">
          ${l}<span class="ml-1 text-[11px] text-stone-400 tabular-nums">${counts[k]}</span>
        </button>`).join('');

      const base = state.filter === 'all' ? state.books : state.books.filter(b => b.status === state.filter);
      const genreCounts = {};
      base.forEach(b => { const g = genreOf(b); genreCounts[g] = (genreCounts[g] || 0) + 1; });
      const genres = Object.keys(genreCounts).sort((a, b) => a.localeCompare(b, 'ja'));
      if (state.genre !== 'all' && !genreCounts[state.genre]) state.genre = 'all';
      const chip = (val, label, n) => `
        <button data-genre="${esc(val)}" class="px-3 py-1 rounded-full text-xs whitespace-nowrap transition border ${state.genre === val ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'}">
          ${esc(label)}${n !== undefined ? `<span class="ml-1 opacity-60">${n}</span>` : ''}
        </button>`;
      $('genre-chips').innerHTML = genres.length > 1 ? chip('all', 'すべてのジャンル') + genres.map(g => chip(g, g, genreCounts[g])).join('') : '';

      document.querySelectorAll('.view-btn').forEach(b => {
        const active = b.dataset.view === state.viewMode;
        b.classList.toggle('bg-white', active);
        b.classList.toggle('shadow-sm', active);
        b.classList.toggle('text-stone-900', active);
        b.classList.toggle('text-stone-400', !active);
      });
      $('shelf-sort').value = state.sort;
      $('genre-list').innerHTML = [...new Set(state.books.map(genreOf))].map(g => `<option value="${esc(g)}">`).join('');
    }

    function spineDim(b) {
      const pages = parseInt(b.pages, 10) || 250;
      const w = clamp(Math.round(pages / 9), 18, 54);
      const h = 158 + (hashStr(b.id) % 42);
      return { w, h };
    }

    function renderBookshelf() {
      renderFilters();
      const container = $('bookshelf-container');
      const list = filteredBooks();

      if (!list.length) {
        container.innerHTML = '';
        $('empty-state').classList.replace('hidden', 'flex');
        if (!state.books.length) {
          $('empty-title').textContent = '本棚は空です';
          $('empty-text').innerHTML = state.isPortfolioMode ? 'まだ本が登録されていません。' : '右上の「本を追加」から、<br>あなたの本棚を作り始めましょう。';
        } else {
          $('empty-title').textContent = '該当する本がありません';
          $('empty-text').textContent = '絞り込みや検索の条件を変えてみてください。';
        }
        return;
      }
      $('empty-state').classList.replace('flex', 'hidden');

      // 本棚の内側の幅(枠と余白を除く)
      const inner = Math.max(240, container.clientWidth - 20 - 24 - 12);
      const rows = [];

      if (state.viewMode === 'cover') {
        const itemW = window.innerWidth >= 640 ? 100 : 78;
        const gap = window.innerWidth >= 640 ? 22 : 14;
        const perRow = Math.max(2, Math.floor((inner + gap) / (itemW + gap)));
        for (let i = 0; i < list.length; i += perRow) {
          const items = list.slice(i, i + perRow).map(b => {
            const pct = b.status === 'reading' && b.pages ? clamp(Math.round((b.currentPage || 0) / b.pages * 100), 0, 100) : null;
            return `<div class="face" data-open="${esc(b.id)}" style="width:${itemW}px" tabindex="0" title="${esc(b.title)}">
              ${coverHtml(b)}
              ${b.status === 'reading' ? '<span class="ribbon" style="right:14%"></span>' : ''}
              ${pct !== null ? `<div class="absolute left-1 right-1 bottom-1 h-1 rounded-full bg-black/25 overflow-hidden"><div class="h-full bg-white" style="width:${pct}%"></div></div>` : ''}
            </div>`;
          }).join('');
          rows.push(`<div class="shelf" style="gap:${gap}px;padding-left:${gap / 2}px">${items}</div>`);
        }
      } else {
        let row = [], used = 0;
        for (const b of list) {
          const d = spineDim(b);
          if (row.length && used + d.w + 3 > inner) { rows.push(row); row = []; used = 0; }
          row.push({ b, d });
          used += d.w + 3;
        }
        if (row.length) rows.push(row);
        for (let i = 0; i < rows.length; i++) {
          rows[i] = `<div class="shelf">${rows[i].map(({ b, d }) => {
            const c = colorFor(b);
            const fs = d.w < 24 ? 10 : d.w < 34 ? 12 : 13;
            return `<div class="spine" data-open="${esc(b.id)}" tabindex="0" style="width:${d.w}px;height:${d.h}px;background:${c.bg};color:${c.fg}" aria-label="${esc(b.title)}">
              <span class="band" style="top:10px"></span><span class="band" style="bottom:12px"></span>
              <div class="spine-title" style="font-size:${fs}px">${esc(b.title)}</div>
              ${d.w >= 24 && b.author ? `<div class="spine-author">${esc(b.author)}</div>` : ''}
              ${b.status === 'reading' ? '<span class="ribbon"></span>' : ''}
              <div class="spine-pop">${coverHtml(b)}</div>
            </div>`;
          }).join('')}</div>`;
        }
      }
      container.innerHTML = `<div class="bookcase">${rows.join('')}</div>`;
    }

    // 本棚のイベント
    document.addEventListener('click', (e) => {
      const opener = e.target.closest('[data-open]');
      if (opener && !e.target.closest('#modal')) openDetail(opener.dataset.open);
    });
    $('bookshelf-container').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const t = e.target.closest('[data-open]'); if (t) openDetail(t.dataset.open); }
    });
    $('status-filters').addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]'); if (!b) return;
      state.filter = b.dataset.filter; renderBookshelf();
    });
    $('genre-chips').addEventListener('click', (e) => {
      const b = e.target.closest('[data-genre]'); if (!b) return;
      state.genre = b.dataset.genre; renderBookshelf();
    });
    $('shelf-search').addEventListener('input', debounce((e) => { state.query = e.target.value; renderBookshelf(); }, 200));
    $('shelf-sort').addEventListener('change', (e) => { state.sort = e.target.value; safeLS.set('hondana_sort', state.sort); renderBookshelf(); });
    document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => {
      state.viewMode = btn.dataset.view; safeLS.set('hondana_view', state.viewMode); renderBookshelf();
    }));
    $('btn-add-book').addEventListener('click', () => openDetail(null));

    /* ================= 本の詳細モーダル ================= */
    const modalFields = ['detail-title', 'detail-author', 'detail-start', 'detail-end', 'detail-genre', 'detail-pages', 'detail-memo', 'detail-current', 'detail-current-range', 'detail-cover-url'];

    function draftBook() {
      return { title: $('detail-title').value.trim() || '無題', author: $('detail-author').value.trim(), coverUrl: state.draftCover };
    }
    function updateCoverPreview() { $('detail-cover').innerHTML = coverHtml(draftBook()); }

    function setDraftStatus(s) {
      state.draftStatus = s;
      document.querySelectorAll('#status-seg [data-status]').forEach(b => {
        const active = b.dataset.status === s;
        b.classList.toggle('bg-white', active);
        b.classList.toggle('shadow-sm', active);
        b.classList.toggle('text-stone-900', active);
        b.classList.toggle('text-stone-500', !active);
      });
      $('progress-block').classList.toggle('hidden', s !== 'reading');
      updateProgressUI();
    }

    function updateProgressUI() {
      const pages = parseInt($('detail-pages').value, 10) || 250;
      const cur = clamp(parseInt($('detail-current').value, 10) || 0, 0, pages);
      $('detail-current-range').max = pages;
      $('detail-current-range').value = cur;
      $('progress-label').textContent = `${Math.round(cur / pages * 100)}% (${cur}/${pages}p)`;
    }

    function renderStars() {
      const box = $('detail-stars');
      box.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement('button');
        s.type = 'button';
        s.className = i <= state.draftRating ? 'ph-fill ph-star text-amber-500' : 'ph ph-star text-stone-300 hover:text-amber-400';
        s.setAttribute('aria-label', `${i}つ星`);
        s.addEventListener('click', () => {
          if (state.isPortfolioMode) return;
          state.draftRating = state.draftRating === i ? 0 : i; // 同じ星をもう一度押すと解除
          renderStars();
        });
        box.appendChild(s);
      }
    }

    function renderDetailPhrases() {
      const wrap = $('detail-phrases-wrap');
      if (!state.selectedBookId) { wrap.classList.add('hidden'); return; }
      wrap.classList.remove('hidden');
      const list = state.phrases.filter(p => p.bookId === state.selectedBookId).sort((a, b) => (a.page || 0) - (b.page || 0));
      $('detail-phrases-count').textContent = list.length ? `${list.length}件` : '';
      $('detail-phrases').innerHTML = list.length ? list.map(p => `
        <div class="text-sm font-serif-jp leading-relaxed pl-3 border-l-2 border-amber-200 text-stone-700 whitespace-pre-wrap">${esc(p.text)}${p.page ? `<span class="text-[10px] text-stone-400 font-sans ml-2">p.${esc(p.page)}</span>` : ''}</div>
      `).join('') : '<p class="text-xs text-stone-400">まだありません</p>';
      $('detail-phrase-add').classList.toggle('hidden', state.isPortfolioMode);
    }

    function openDetail(id) {
      const b = id ? state.books.find(x => x.id === id) : null;
      if (id && !b) return;
      state.selectedBookId = b ? b.id : null;
      $('detail-title').value = b ? b.title : '';
      $('detail-author').value = b ? b.author : '';
      $('detail-start').value = b ? b.startDate : '';
      $('detail-end').value = b ? b.endDate : '';
      $('detail-genre').value = b && b.genre !== '未分類' ? b.genre : '';
      $('detail-pages').value = b ? b.pages : '';
      $('detail-memo').value = b ? b.memo : '';
      $('detail-current').value = b && b.currentPage ? b.currentPage : 0;
      state.draftCover = b ? b.coverUrl : '';
      $('detail-cover-url').value = state.draftCover.startsWith('data:') ? '' : state.draftCover;
      $('detail-cover-url').placeholder = state.draftCover.startsWith('data:') ? 'アップロードした画像を使用中' : '画像URLを貼り付け';
      $('cover-edit').classList.add('hidden');
      state.draftRating = b ? b.rating : 0;
      setDraftStatus(b ? b.status : 'wish');
      updateCoverPreview();
      renderStars();
      renderDetailPhrases();

      const ro = state.isPortfolioMode;
      modalFields.forEach(f => { $(f).disabled = ro; });
      document.querySelectorAll('#status-seg button').forEach(x => x.disabled = ro);
      $('cover-tools').classList.toggle('hidden', ro);
      $('detail-actions').classList.toggle('hidden', ro);
      $('btn-delete-book').classList.toggle('hidden', !b);

      const modal = $('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => modal.classList.add('modal-open'));
      if (!b) setTimeout(() => $('detail-title').focus(), 50);
    }

    function closeModal() {
      const modal = $('modal');
      modal.classList.remove('modal-open');
      document.body.style.overflow = '';
      setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
    }

    $('btn-close-modal').addEventListener('click', closeModal);
    $('btn-cancel-book').addEventListener('click', closeModal);
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal(); });

    $('detail-title').addEventListener('input', updateCoverPreview);
    $('detail-author').addEventListener('input', updateCoverPreview);
    $('detail-pages').addEventListener('input', updateProgressUI);
    $('detail-current').addEventListener('input', updateProgressUI);
    $('detail-current-range').addEventListener('input', (e) => { $('detail-current').value = e.target.value; updateProgressUI(); });

    $('status-seg').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-status]'); if (!btn || state.isPortfolioMode) return;
      const s = btn.dataset.status;
      // ステータスに合わせて日付を自動で入れる
      if ((s === 'reading' || s === 'read') && !$('detail-start').value) $('detail-start').value = todayStr();
      if (s === 'read' && !$('detail-end').value) $('detail-end').value = todayStr();
      setDraftStatus(s);
    });

    $('btn-cover-toggle').addEventListener('click', () => $('cover-edit').classList.toggle('hidden'));
    $('detail-cover-url').addEventListener('input', (e) => { state.draftCover = e.target.value.trim(); updateCoverPreview(); });
    $('btn-cover-clear').addEventListener('click', () => {
      state.draftCover = ''; $('detail-cover-url').value = ''; $('detail-cover-url').placeholder = '画像URLを貼り付け'; updateCoverPreview();
    });
    $('detail-cover-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        state.draftCover = await resizeImage(file);
        $('detail-cover-url').value = '';
        $('detail-cover-url').placeholder = 'アップロードした画像を使用中';
        updateCoverPreview();
      } catch { showToast('画像を読み込めませんでした', 'error'); }
      e.target.value = '';
    });

    $('btn-save-book').addEventListener('click', async () => {
      const title = $('detail-title').value.trim();
      if (!title) { showToast('タイトルを入力してください', 'error'); $('detail-title').focus(); return; }
      const existing = state.books.find(b => b.id === state.selectedBookId);
      const pages = parseInt($('detail-pages').value, 10) || 250;
      let currentPage = clamp(parseInt($('detail-current').value, 10) || 0, 0, pages);
      if (state.draftStatus === 'read') currentPage = pages;
      const start = $('detail-start').value, end = $('detail-end').value;
      if (start && end && end < start) { showToast('読み終えた日が読み始めた日より前になっています', 'error'); return; }

      const book = normalizeBook({
        ...(existing || { id: generateId(), addedAt: Date.now() }),
        title,
        author: $('detail-author').value.trim(),
        coverUrl: state.draftCover,
        status: state.draftStatus,
        rating: state.draftRating,
        memo: $('detail-memo').value.trim(),
        startDate: start, endDate: end,
        genre: $('detail-genre').value.trim() || '未分類',
        pages, currentPage
      });
      if (existing) Object.assign(existing, book); else state.books.push(book);

      closeModal();
      renderAll();
      showToast(existing ? '変更を保存しました' : '本棚に追加しました');
      await cloudSet('books', book.id, book);
    });

    $('btn-delete-book').addEventListener('click', async () => {
      const id = state.selectedBookId;
      const b = state.books.find(x => x.id === id);
      if (!b || !confirm(`「${b.title}」を本棚から削除しますか？\n(この本のフレーズは「書籍未指定」として残ります)`)) return;
      state.books = state.books.filter(x => x.id !== id);
      const removedLinks = state.links.filter(l => l.source === id || l.target === id);
      state.links = state.links.filter(l => l.source !== id && l.target !== id);
      closeModal();
      renderAll();
      showToast('本を削除しました');
      await cloudDelete('books', id);
      for (const l of removedLinks) await cloudDelete('links', linkId(l));
    });

    async function addPhrase(bookId, text, page) {
      const p = { id: generateId(), bookId: bookId || null, page: page ? parseInt(page, 10) : null, text, addedAt: Date.now() };
      state.phrases.push(p);
      await cloudSet('phrases', p.id, p);
      return p;
    }

    $('btn-detail-phrase').addEventListener('click', async () => {
      const text = $('detail-phrase-text').value.trim();
      if (!text || !state.selectedBookId) return;
      await addPhrase(state.selectedBookId, text, $('detail-phrase-page').value);
      $('detail-phrase-text').value = ''; $('detail-phrase-page').value = '';
      renderDetailPhrases();
      showToast('フレーズを記録しました');
    });
    $('detail-phrase-text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) $('btn-detail-phrase').click(); });

    /* ================= フレーズ ================= */
    function renderPhraseBookSelect() {
      const sel = $('phrase-book-select');
      const cur = sel.value;
      const books = [...state.books].sort((a, b) => (a.status === 'reading' ? -1 : 0) - (b.status === 'reading' ? -1 : 0) || a.title.localeCompare(b.title, 'ja'));
      sel.innerHTML = '<option value="">書籍を選択 (任意)</option>' +
        books.map(b => `<option value="${esc(b.id)}">${b.status === 'reading' ? '📖 ' : ''}${esc(b.title)}</option>`).join('');
      if (books.some(b => b.id === cur)) sel.value = cur;
    }

    const phraseGenre = (p) => { const b = state.books.find(x => x.id === p.bookId); return b ? genreOf(b) : '書籍未指定'; };

    function renderPhrases() {
      // ジャンルの絞り込み
      const counts = {};
      state.phrases.forEach(p => { const g = phraseGenre(p); counts[g] = (counts[g] || 0) + 1; });
      const genres = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ja'));
      if (state.phrasesGenre !== 'all' && !counts[state.phrasesGenre]) state.phrasesGenre = 'all';
      const chip = (val, label, n) => `<button data-pgenre="${esc(val)}" class="px-3 py-1 rounded-full text-xs whitespace-nowrap transition border ${state.phrasesGenre === val ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'}">${esc(label)}<span class="ml-1 opacity-60">${n}</span></button>`;
      $('phrase-chips').innerHTML = state.phrases.length ? chip('all', 'すべて', state.phrases.length) + genres.map(g => chip(g, g, counts[g])).join('') : '';

      let list = state.phrases.slice();
      if (state.phrasesGenre !== 'all') list = list.filter(p => phraseGenre(p) === state.phrasesGenre);
      const q = state.phrasesQuery.trim().toLowerCase();
      if (q) list = list.filter(p => {
        const b = state.books.find(x => x.id === p.bookId);
        return (p.text || '').toLowerCase().includes(q) || (b && (b.title + b.author).toLowerCase().includes(q));
      });
      list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

      const container = $('phrases-list');
      if (!list.length) {
        container.innerHTML = '';
        $('phrases-empty-msg').textContent = state.phrases.length ? '条件に合うフレーズはありません。' : 'まだフレーズが記録されていません。';
        $('phrases-empty').classList.replace('hidden', 'flex');
        return;
      }
      $('phrases-empty').classList.replace('flex', 'hidden');

      container.innerHTML = list.map(p => {
        const b = state.books.find(x => x.id === p.bookId);
        const dateStr = new Date(p.addedAt || Date.now()).toLocaleDateString('ja-JP');
        const bookHtml = b ? `
          <button data-open="${esc(b.id)}" class="flex items-center gap-3 mt-4 hover:bg-stone-50 p-1.5 -ml-1.5 rounded-lg transition text-left">
            <div class="w-7 shrink-0">${coverHtml(b)}</div>
            <div class="min-w-0">
              <div class="text-xs font-semibold truncate">${esc(b.title)}</div>
              <div class="text-[11px] text-stone-400 truncate">${esc(b.author)}${p.page ? ` · p.${esc(p.page)}` : ''}</div>
            </div>
          </button>` : `<div class="mt-4 text-[11px] text-stone-400 flex items-center gap-1"><i class="ph ph-book"></i>書籍未指定${p.page ? ` · p.${esc(p.page)}` : ''}</div>`;
        const actions = state.isPortfolioMode ? '' : `
          <div class="absolute top-3 right-3 flex gap-1 md:opacity-0 md:group-hover:opacity-100 transition">
            <button data-action="copy" data-id="${esc(p.id)}" class="w-8 h-8 rounded-full hover:bg-stone-100 text-stone-500" title="コピー"><i class="ph ph-copy"></i></button>
            <button data-action="edit" data-id="${esc(p.id)}" class="w-8 h-8 rounded-full hover:bg-stone-100 text-stone-500" title="編集"><i class="ph ph-pencil-simple"></i></button>
            <button data-action="delete" data-id="${esc(p.id)}" class="w-8 h-8 rounded-full hover:bg-red-50 text-red-500" title="削除"><i class="ph ph-trash"></i></button>
          </div>`;
        return `<article class="break-inside-avoid mb-5 bg-white p-6 pt-8 rounded-2xl border border-stone-200/70 relative group transition hover:shadow-md">
          <i class="ph-fill ph-quotes absolute top-4 left-5 text-2xl text-amber-200"></i>
          ${actions}
          <p class="font-serif-jp text-[15px] leading-loose whitespace-pre-wrap relative">${esc(p.text)}</p>
          <div class="flex items-end justify-between gap-2">
            ${bookHtml}
            <span class="text-[10px] text-stone-300 shrink-0">${dateStr}</span>
          </div>
        </article>`;
      }).join('');
    }

    function resetPhraseForm() {
      state.editingPhraseId = null;
      $('phrase-text').value = ''; $('phrase-page').value = '';
      $('phrase-form-title').innerHTML = '<i class="ph-fill ph-quotes text-lg text-amber-700"></i> 新しいフレーズを記録';
      $('btn-add-phrase').querySelector('span').textContent = '記録する';
      $('btn-cancel-phrase').classList.add('hidden');
    }

    $('phrases-list').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]'); if (!btn) return;
      const p = state.phrases.find(x => x.id === btn.dataset.id); if (!p) return;
      if (btn.dataset.action === 'copy') {
        const b = state.books.find(x => x.id === p.bookId);
        const text = b ? `${p.text}\n——${b.author ? b.author + '『' + b.title + '』' : '『' + b.title + '』'}${p.page ? ' p.' + p.page : ''}` : p.text;
        try { await navigator.clipboard.writeText(text); showToast('コピーしました'); } catch { showToast('コピーできませんでした', 'error'); }
      } else if (btn.dataset.action === 'edit') {
        state.editingPhraseId = p.id;
        renderPhraseBookSelect();
        $('phrase-book-select').value = p.bookId || '';
        $('phrase-page').value = p.page || '';
        $('phrase-text').value = p.text;
        $('phrase-form-title').innerHTML = '<i class="ph ph-pencil-simple text-lg text-amber-700"></i> フレーズを編集';
        $('btn-add-phrase').querySelector('span').textContent = '更新する';
        $('btn-cancel-phrase').classList.remove('hidden');
        $('phrase-form-container').scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('phrase-text').focus();
      } else if (btn.dataset.action === 'delete') {
        if (!confirm('このフレーズを削除しますか？')) return;
        state.phrases = state.phrases.filter(x => x.id !== p.id);
        if (state.editingPhraseId === p.id) resetPhraseForm();
        renderPhrases();
        showToast('フレーズを削除しました');
        await cloudDelete('phrases', p.id);
      }
    });

    $('phrase-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (state.isPortfolioMode) return;
      const text = $('phrase-text').value.trim();
      if (!text) { showToast('フレーズを入力してください', 'error'); return; }
      const bookId = $('phrase-book-select').value || null;
      const page = $('phrase-page').value;
      if (state.editingPhraseId) {
        const p = state.phrases.find(x => x.id === state.editingPhraseId);
        if (p) {
          Object.assign(p, { text, bookId, page: page ? parseInt(page, 10) : null });
          resetPhraseForm(); renderPhrases();
          showToast('フレーズを更新しました');
          await cloudSet('phrases', p.id, p);
        }
      } else {
        await addPhrase(bookId, text, page);
        resetPhraseForm(); renderPhrases();
        showToast('フレーズを記録しました');
      }
    });
    $('btn-cancel-phrase').addEventListener('click', resetPhraseForm);
    $('phrase-chips').addEventListener('click', (e) => {
      const b = e.target.closest('[data-pgenre]'); if (!b) return;
      state.phrasesGenre = b.dataset.pgenre; renderPhrases();
    });
    $('phrase-search').addEventListener('input', debounce((e) => { state.phrasesQuery = e.target.value; renderPhrases(); }, 200));

    /* ================= タブ ================= */
    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        const active = b.dataset.tab === tab;
        b.classList.toggle('text-stone-900', active);
        b.classList.toggle('border-stone-900', active);
        b.classList.toggle('text-stone-400', !active);
        b.classList.toggle('border-transparent', !active);
      });
      document.querySelectorAll('.view').forEach(v => {
        const active = v.id === `view-${tab}`;
        v.classList.toggle('hidden', !active);
        v.classList.toggle('flex', active);
      });
      if (tab !== 'serendipity') stopSerendipity();
      if (tab === 'bookshelf') renderBookshelf();
      else setTimeout(refreshActiveTab, 30);
    }
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

    /* ================= 共有 ================= */
    $('btn-share').addEventListener('click', async () => {
      if (!currentUser) { showToast('本棚を共有するにはログインしてください', 'error'); return; }
      if (!state.books.length) { showToast('共有する本がありません', 'error'); return; }
      if (!confirm('現在の本棚・感想メモ・フレーズを、リンクを知っている人が閲覧できる形で共有します。よろしいですか？')) return;
      showToast('共有リンクを作成しています...', 'info');
      try {
        const id = generateId() + generateId();
        let payload = {
          books: state.books, links: state.links, phrases: state.phrases,
          ownerUid: currentUser.uid, ownerName: currentUser.displayName || '', createdAt: Date.now()
        };
        // Firestoreの1ドキュメント上限(1MB)対策: 大きすぎる場合はアップロード画像の表紙を外す
        if (JSON.stringify(payload).length > 900000) {
          payload = { ...payload, books: state.books.map(b => b.coverUrl && b.coverUrl.startsWith('data:') ? { ...b, coverUrl: '' } : b) };
        }
        await setDoc(doc(db, 'portfolios', id), clean(payload));
        const url = location.href.split('?')[0] + '?portfolio=' + id;
        if (navigator.share && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
          try { await navigator.share({ title: 'hondana - 私の本棚', url }); return; } catch {}
        }
        await navigator.clipboard.writeText(url);
        showToast('共有リンクをコピーしました');
      } catch (e) {
        console.error(e);
        showToast('リンクの作成に失敗しました', 'error');
      }
    });

    /* ================= Knowledge Map ================= */
    const mapContainer = $('map-container');
    let isDraggingMap = false, dragMoved = false, startX, startY, scrollLeft, scrollTop;

    $('btn-connect-mode').addEventListener('click', (e) => {
      state.isConnectMode = !state.isConnectMode;
      state.connectSourceId = null;
      const btn = e.currentTarget;
      btn.classList.toggle('bg-amber-600', state.isConnectMode);
      btn.classList.toggle('hover:bg-amber-500', state.isConnectMode);
      btn.classList.toggle('bg-slate-800', !state.isConnectMode);
      btn.querySelector('span').textContent = state.isConnectMode ? 'Connect: ON' : 'Connect: OFF';
      $('map-hint').textContent = state.isConnectMode
        ? '結びたい本を2冊、順にタップしてください。線をタップすると消せます。'
        : '本と本を線で結び、あなただけの「思考の星座」を描きましょう。';
      renderMapping();
    });

    const startDrag = (x, y) => { isDraggingMap = true; dragMoved = false; startX = x; startY = y; scrollLeft = mapContainer.scrollLeft; scrollTop = mapContainer.scrollTop; };
    const moveDrag = (x, y) => {
      if (!isDraggingMap) return;
      if (Math.abs(x - startX) + Math.abs(y - startY) > 4) dragMoved = true;
      mapContainer.scrollLeft = scrollLeft - (x - startX);
      mapContainer.scrollTop = scrollTop - (y - startY);
    };
    mapContainer.addEventListener('mousedown', (e) => { if (e.target.closest('.map-node')) return; startDrag(e.pageX, e.pageY); mapContainer.classList.add('cursor-grabbing'); });
    window.addEventListener('mousemove', (e) => moveDrag(e.pageX, e.pageY));
    window.addEventListener('mouseup', () => { isDraggingMap = false; mapContainer.classList.remove('cursor-grabbing'); });
    mapContainer.addEventListener('touchstart', (e) => { if (e.target.closest('.map-node')) return; startDrag(e.touches[0].pageX, e.touches[0].pageY); }, { passive: true });
    mapContainer.addEventListener('touchmove', (e) => { if (!isDraggingMap) return; e.preventDefault(); moveDrag(e.touches[0].pageX, e.touches[0].pageY); }, { passive: false });
    mapContainer.addEventListener('touchend', () => { isDraggingMap = false; });

    function getBookTime(b) {
      for (const d of [b.endDate, b.startDate]) { const t = d ? new Date(d).getTime() : NaN; if (!isNaN(t)) return t; }
      return b.addedAt || Date.now();
    }

    function renderMapping() {
      const content = $('map-content'), svg = $('map-svg'), nodes = $('map-nodes'), grid = $('map-grid');
      svg.innerHTML = ''; nodes.innerHTML = ''; grid.innerHTML = '';
      if (!state.books.length) {
        grid.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-sm text-white/40 font-serif-jp">本を追加すると、ここに星座が現れます。</div>';
        return;
      }
      const books = state.books.map(b => ({ ...b, g: genreOf(b), time: getBookTime(b) }));
      const genres = [...new Set(books.map(b => b.g))].sort((a, b) => a.localeCompare(b, 'ja'));
      const times = books.map(b => b.time);
      const minT = Math.min(...times);
      const range = Math.max(Math.max(...times) - minT, 1000 * 60 * 60 * 24 * 30);
      const padX = 150, padY = 110, lane = 190;
      const W = Math.max(1000, (mapContainer.clientWidth || 1000) * 1.5);
      const H = Math.max(600, genres.length * lane + padY * 2 - lane / 2);
      content.style.width = `${W}px`; content.style.height = `${H}px`;

      // 背景の星
      let stars = '', seed = 7;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 140; i++) {
        const size = rnd() < 0.85 ? 1 : 2;
        stars += `<div class="absolute rounded-full bg-white" style="left:${Math.round(rnd() * W)}px;top:${Math.round(rnd() * H)}px;width:${size}px;height:${size}px;opacity:${(0.15 + rnd() * 0.5).toFixed(2)}"></div>`;
      }
      grid.innerHTML = stars + genres.map((g, i) =>
        `<div class="absolute left-6 text-[10px] font-medium text-white/35 tracking-widest" style="top:${padY + i * lane - 14}px">${esc(g)}</div>`).join('');

      const coords = {};
      books.forEach(b => {
        const gi = genres.indexOf(b.g);
        let x = padX + (b.time - minT) / range * (W - padX * 2);
        let y = padY + gi * lane + ((hashStr(b.id) % 110) - 55);
        for (let iter = 0; iter < 50; iter++) {
          let hit = false;
          for (const id in coords) {
            const dx = x - coords[id].x, dy = y - coords[id].y, dist = Math.hypot(dx, dy);
            if (dist < 84) { hit = true; const a = dist === 0 ? (hashStr(b.id + iter) % 628) / 100 : Math.atan2(dy, dx); x += Math.cos(a) * 15; y += Math.sin(a) * 15; }
          }
          if (!hit) break;
        }
        x = clamp(x, 40, W - 40); y = clamp(y, 40, H - 40);
        coords[b.id] = { x, y };
        const isSrc = state.isConnectMode && state.connectSourceId === b.id;
        nodes.insertAdjacentHTML('beforeend', `
          <div class="map-node absolute -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer group flex flex-col items-center gap-2 z-10 hover:z-50 transition ${isSrc ? 'scale-110 z-50' : 'hover:scale-110'}" style="left:${x}px;top:${y}px" data-id="${esc(b.id)}">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 transition ${isSrc ? 'border-amber-300 ring-4 ring-amber-400/40 shadow-[0_0_24px_rgba(251,191,36,.7)]' : 'border-white/25 group-hover:border-white group-hover:shadow-[0_0_16px_rgba(255,255,255,.5)]'}">
              <div class="w-full -mt-[25%]">${coverHtml(b)}</div>
            </div>
            <span class="text-[10px] font-medium text-white/70 group-hover:text-white truncate max-w-[120px] drop-shadow">${esc(b.title)}</span>
          </div>`);
      });

      const ns = 'http://www.w3.org/2000/svg';
      state.links.forEach(link => {
        const s = coords[link.source], t = coords[link.target];
        if (!s || !t) return;
        const cx = (s.x + t.x) / 2;
        const d = `M ${s.x} ${s.y} C ${cx} ${s.y}, ${cx} ${t.y}, ${t.x} ${t.y}`;
        const line = document.createElementNS(ns, 'path');
        line.setAttribute('d', d); line.setAttribute('fill', 'none');
        line.setAttribute('stroke', 'rgba(255,255,255,0.3)'); line.setAttribute('stroke-width', '1.5');
        line.style.pointerEvents = 'none';
        svg.appendChild(line);
        if (state.isConnectMode && !state.isPortfolioMode) {
          const hit = document.createElementNS(ns, 'path'); // タップしやすい太い透明線
          hit.setAttribute('d', d); hit.setAttribute('fill', 'none');
          hit.setAttribute('stroke', 'transparent'); hit.setAttribute('stroke-width', '14');
          hit.style.cursor = 'pointer';
          hit.addEventListener('mouseenter', () => line.setAttribute('stroke', 'rgba(251,191,36,.9)'));
          hit.addEventListener('mouseleave', () => line.setAttribute('stroke', 'rgba(255,255,255,0.3)'));
          hit.addEventListener('click', async () => {
            state.links = state.links.filter(l => !(l.source === link.source && l.target === link.target));
            renderMapping();
            showToast('星座の線を消しました');
            await cloudDelete('links', linkId(link));
          });
          svg.appendChild(hit);
        }
      });

      nodes.querySelectorAll('.map-node').forEach(node => node.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = node.dataset.id;
        if (!state.isConnectMode) { openDetail(id); return; }
        if (!state.connectSourceId) { state.connectSourceId = id; renderMapping(); return; }
        if (state.connectSourceId !== id) {
          const a = state.connectSourceId;
          const exists = state.links.some(l => (l.source === a && l.target === id) || (l.source === id && l.target === a));
          if (!exists) {
            const link = { source: a, target: id };
            state.links.push(link);
            showToast('本と本を結びました');
            cloudSet('links', linkId(link), link);
          }
        }
        state.connectSourceId = null;
        renderMapping();
      }));
    }

    $('btn-export-map').addEventListener('click', async () => {
      if (!state.books.length) return;
      showToast('画像を書き出しています...', 'info');
      const content = $('map-content');
      const imgs = [...content.querySelectorAll('img')];
      const originals = imgs.map(i => i.src);
      try {
        // 外部画像を一時的にdataURLへ(CORSで描けない画像は自動の装丁が使われます)
        for (const img of imgs) {
          if (img.src.startsWith('data:')) continue;
          try {
            const res = await fetch(img.src, { mode: 'cors', credentials: 'omit' });
            if (!res.ok) throw 0;
            const blob = await res.blob();
            img.src = await new Promise(r => { const fr = new FileReader(); fr.onloadend = () => r(fr.result); fr.readAsDataURL(blob); });
          } catch { img.style.visibility = 'hidden'; }
        }
        const canvas = await html2canvas(content, { backgroundColor: '#090a0f', scale: Math.min(window.devicePixelRatio || 2, 2), useCORS: true });
        const a = document.createElement('a');
        a.download = `hondana_constellation_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('星座を画像として保存しました');
      } catch (e) {
        console.error(e);
        showToast('画像の保存に失敗しました', 'error');
      } finally {
        imgs.forEach((img, i) => { img.src = originals[i]; img.style.visibility = ''; });
      }
    });

    /* ================= Serendipity ================= */
    let serendipityReq = null;
    let floating = [];

    function initSerendipityView() {
      const container = $('serendipity-container');
      const canvas = $('serendipity-canvas');
      container.innerHTML = '';
      floating = [];
      if (!state.phrases.length) { $('serendipity-empty').classList.replace('hidden', 'flex'); stopSerendipity(); return; }
      $('serendipity-empty').classList.replace('flex', 'hidden');
      const W = container.clientWidth, H = container.clientHeight;
      canvas.width = W; canvas.height = H;
      const maxCount = W < 640 ? 12 : 26;
      const picks = [...state.phrases].sort(() => Math.random() - 0.5).slice(0, maxCount);
      picks.forEach(p => {
        const b = state.books.find(x => x.id === p.bookId);
        const el = document.createElement('div');
        el.className = 'floating-phrase';
        el.innerHTML = `<div class="floating-phrase-text">${esc(p.text)}</div>
          <div class="floating-phrase-meta"><i class="ph ph-book-open"></i> ${esc(b ? b.title : '書籍未指定')}${p.page ? ` p.${esc(p.page)}` : ''}</div>`;
        el.addEventListener('click', () => { if (b) openDetail(b.id); });
        el.addEventListener('mouseenter', () => el.dataset.hover = '1');
        el.addEventListener('mouseleave', () => el.dataset.hover = '');
        container.appendChild(el);
        const r = el.getBoundingClientRect();
        const angle = Math.random() * Math.PI * 2, speed = 0.08 + Math.random() * 0.14;
        floating.push({
          el, w: r.width, h: r.height,
          x: Math.random() * Math.max(0, W - r.width), y: Math.random() * Math.max(0, H - r.height),
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, phase: Math.random() * Math.PI * 2
        });
      });
      startSerendipity();
    }

    function startSerendipity() {
      stopSerendipity();
      const canvas = $('serendipity-canvas');
      const ctx = canvas.getContext('2d');
      let last = performance.now();
      const loop = (time) => {
        if ($('view-serendipity').classList.contains('hidden') || document.hidden) { serendipityReq = requestAnimationFrame(loop); last = time; return; }
        const W = canvas.clientWidth, H = canvas.clientHeight;
        if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
        const dt = Math.min((time - last) / 16.67, 3);
        last = time;
        ctx.clearRect(0, 0, W, H);
        for (const it of floating) {
          if (it.el.dataset.hover) { it.el.style.transform = `translate(${it.x}px, ${it.y}px) scale(1.03)`; continue; }
          it.x += it.vx * dt; it.y += it.vy * dt;
          if (it.x < 0) { it.x = 0; it.vx *= -1; } else if (it.x + it.w > W) { it.x = Math.max(0, W - it.w); it.vx *= -1; }
          if (it.y < 0) { it.y = 0; it.vy *= -1; } else if (it.y + it.h > H) { it.y = Math.max(0, H - it.h); it.vy *= -1; }
          it.el.style.transform = `translate(${it.x}px, ${it.y + Math.sin(time / 2000 + it.phase) * 5}px)`;
        }
        ctx.lineWidth = 1.2;
        const reach = Math.min(340, W * 0.5);
        for (let i = 0; i < floating.length; i++) for (let j = i + 1; j < floating.length; j++) {
          const a = floating[i], b = floating[j];
          const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
          const dist = Math.hypot(ax - bx, ay - by);
          if (dist < reach) {
            ctx.strokeStyle = `rgba(166, 120, 60, ${Math.pow(1 - dist / reach, 2) * 0.45})`;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
          }
        }
        serendipityReq = requestAnimationFrame(loop);
      };
      serendipityReq = requestAnimationFrame(loop);
    }
    function stopSerendipity() { if (serendipityReq) cancelAnimationFrame(serendipityReq); serendipityReq = null; }
    $('btn-shuffle').addEventListener('click', initSerendipityView);

    /* ================= その他 ================= */
    let lastWidth = window.innerWidth;
    window.addEventListener('resize', debounce(() => {
      if (window.innerWidth === lastWidth) return; // スマホのアドレスバー伸縮で再描画しない
      lastWidth = window.innerWidth;
      if (state.activeTab === 'bookshelf') renderBookshelf();
      else refreshActiveTab();
    }, 150));

    switchTab('bookshelf');
    initApp();
  </script>
</body>
