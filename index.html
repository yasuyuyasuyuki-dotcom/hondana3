<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f1ea">
  <title>hondana - デジタル読書記録＆本棚</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f5f1ea;
      --ink: #1c1917;
      --case: #efe6d6;
      --oak-light: #dcc29b;
      --oak: #c4a073;
      --oak-dark: #9c7a50;
    }
    body {
      font-family: 'Inter', 'Hiragino Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .font-serif-jp { font-family: 'Noto Serif JP', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    /* ===== 本棚 ===== */
    .bookcase {
      background:
        linear-gradient(to right, rgba(0,0,0,.06), transparent 6%, transparent 94%, rgba(0,0,0,.06)),
        var(--case);
      border: 10px solid var(--oak);
      border-top-width: 14px;
      border-radius: 6px;
      padding: 8px 12px 18px;
      box-shadow: inset 0 0 24px rgba(80,55,25,.12), 0 18px 30px -18px rgba(60,40,20,.45);
    }
    .shelf {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      min-height: 210px;
      padding: 26px 6px 0;
      margin-bottom: 30px;
    }
    .shelf::before { /* 棚板の上に落ちる影 */
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
      background: linear-gradient(to top, rgba(60,40,20,.18), transparent);
      pointer-events: none;
    }
    .shelf::after { /* 棚板 */
      content: '';
      position: absolute; left: -12px; right: -12px; bottom: -14px; height: 14px;
      background: linear-gradient(var(--oak-light), var(--oak) 55%, var(--oak-dark));
      box-shadow: 0 6px 10px -4px rgba(60,40,20,.35);
    }
    .shelf:last-child { margin-bottom: 0; }

    .spine {
      position: relative;
      flex-shrink: 0;
      border-radius: 2px 2px 1px 1px;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 0 18px;
      transition: transform .25s cubic-bezier(.2,.8,.2,1);
      box-shadow:
        inset 2px 0 2px rgba(255,255,255,.22),
        inset -3px 0 5px rgba(0,0,0,.2),
        1px 0 2px rgba(0,0,0,.18);
      z-index: 1;
    }
    .spine:hover, .spine:focus-visible { transform: translateY(-10px); z-index: 20; outline: none; }
    .spine .band { position: absolute; left: 0; right: 0; height: 2px; background: currentColor; opacity: .35; }
    .spine-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Noto Serif JP', serif;
      font-weight: 600;
      letter-spacing: .12em;
      line-height: 1;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .spine-author {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 9px;
      letter-spacing: .08em;
      opacity: .75;
      max-height: 26%;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      margin-top: 6px; flex-shrink: 0;
    }
    .ribbon {
      position: absolute; top: -10px; right: 22%;
      width: 5px; height: 22px; background: #b3261e;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
    }
    .spine-pop {
      position: absolute; bottom: calc(100% + 14px); left: 50%;
      transform: translateX(-50%) translateY(6px);
      width: 104px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    @media (hover: hover) {
      .spine:hover .spine-pop { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .face { flex-shrink: 0; cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1); position: relative; }
    .face:hover { transform: translateY(-8px) rotate(-1deg); z-index: 5; }

    /* ===== 表紙 ===== */
    .cover {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: 2px 4px 4px 2px;
      container-type: inline-size;
      box-shadow: -1px 0 0 rgba(0,0,0,.08), 4px 6px 14px rgba(40,30,20,.25);
      background: #ddd;
    }
    .cover::after { /* 背の折り目 */
      content: ''; position: absolute; top: 0; bottom: 0; left: 4%; width: 2px;
      background: linear-gradient(to right, rgba(0,0,0,.12), rgba(255,255,255,.25));
      pointer-events: none;
    }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .gen-cover {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 14cqw 11cqw 11cqw 14cqw;
      font-family: 'Noto Serif JP', serif;
    }
    .gen-cover .gc-title { font-size: 11.5cqw; font-weight: 700; line-height: 1.35; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .gen-cover .gc-rule { width: 22cqw; height: 1px; background: currentColor; opacity: .5; margin: 6cqw 0; }
    .gen-cover .gc-author { font-size: 7.5cqw; opacity: .8; line-height: 1.4; }

    /* ===== モーダル・トースト ===== */
    .modal-panel { transform: translateY(16px) scale(.98); opacity: 0; transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .2s; }
    .modal-open .modal-panel { transform: none; opacity: 1; }
    .toast { transform: translateY(16px); opacity: 0; transition: all .3s cubic-bezier(.16,1,.3,1); }
    .toast.show { transform: none; opacity: 1; }

    input[type=range] { accent-color: #1c1917; }

    /* ===== マップ ===== */
    .bg-space { background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); }
    #map-container { touch-action: none; }

    /* ===== セレンディピティ ===== */
    .bg-serendipity { background: linear-gradient(135deg, #fbf9f5 0%, #ece8e1 100%); }
    .floating-phrase {
      position: absolute; top: 0; left: 0;
      width: max-content; max-width: min(360px, 80vw);
      padding: 1.1rem 1.3rem;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(60,45,30,.08);
      cursor: pointer; will-change: transform; z-index: 10;
      transition: box-shadow .3s, border-color .3s, background .3s;
    }
    .floating-phrase:hover { z-index: 50 !important; background: rgba(255,255,255,.96); box-shadow: 0 12px 40px rgba(60,45,30,.16); border-color: rgba(180,140,90,.35); }
    .floating-phrase-text { font-family: 'Noto Serif JP', serif; font-size: .9rem; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
    .floating-phrase-meta { font-size: .68rem; color: #78716c; text-align: right; max-height: 0; opacity: 0; overflow: hidden; transition: all .3s; }
    .floating-phrase:hover .floating-phrase-meta { max-height: 30px; opacity: 1; margin-top: .6rem; }
  </style>

  <script>
    (function initPWA() {
      const manifest = {
        name: "hondana - デジタル読書記録", short_name: "hondana", start_url: ".",
        display: "standalone", background_color: "#f5f1ea", theme_color: "#f5f1ea",
        icons: [
          { src: "https://placehold.co/192x192/1c1917/f5f1ea?text=h", sizes: "192x192", type: "image/png" },
          { src: "https://placehold.co/512x512/1c1917/f5f1ea?text=h", sizes: "512x512", type: "image/png" }
        ]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      document.head.appendChild(link);
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#f5f1ea]/85 backdrop-blur-md border-b border-stone-200/70 sticky top-0 z-30 pt-safe">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight font-serif-jp">hondana</h1>
      <div class="flex items-center gap-2 sm:gap-3">
        <div id="auth-container" class="flex items-center gap-2">
          <button id="btn-login" class="text-xs font-medium text-stone-700 bg-white border border-stone-200 hover:bg-stone-50 px-3 py-1.5 rounded-full transition shadow-sm flex items-center gap-1.5">
            <i class="ph-fill ph-google-logo"></i><span class="hidden sm:inline">ログイン</span>
          </button>
          <div id="user-info" class="hidden items-center gap-2">
            <img id="user-avatar" src="" alt="" class="w-8 h-8 rounded-full border border-stone-200 object-cover">
            <button id="btn-logout" class="text-stone-500 hover:text-stone-900 transition" title="ログアウト"><i class="ph ph-sign-out text-lg"></i></button>
          </div>
        </div>
        <button id="btn-share" class="w-9 h-9 flex items-center justify-center rounded-full text-stone-600 hover:bg-stone-200/60 transition" title="本棚を共有">
          <i class="ph ph-share-network text-lg"></i>
        </button>
        <button id="btn-add-book" class="flex items-center gap-2 bg-stone-900 hover:bg-stone-700 text-white px-4 py-2 rounded-full text-sm font-medium transition shadow-sm">
          <i class="ph ph-plus-bold"></i><span class="hidden sm:inline">本を追加</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 共有閲覧時のバナー -->
  <div id="portfolio-banner" class="hidden bg-stone-900 text-stone-100 text-xs">
    <div class="max-w-5xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
      <span id="portfolio-banner-text" class="flex items-center gap-2"><i class="ph ph-eye"></i>共有された本棚を閲覧しています</span>
      <a href="./" class="underline underline-offset-2 whitespace-nowrap">自分の本棚へ</a>
    </div>
  </div>

  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 flex flex-col">

    <!-- Tabs -->
    <nav class="flex gap-6 mb-6 border-b border-stone-200 overflow-x-auto no-scrollbar">
      <button data-tab="bookshelf" class="tab-btn pb-3 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition">Bookshelf</button>
      <button data-tab="phrases" class="tab-btn pb-3 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition">Phrases</button>
      <button data-tab="mapping" class="tab-btn pb-3 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition"><i class="ph ph-planet align-middle"></i> Knowledge Map</button>
      <button data-tab="serendipity" class="tab-btn pb-3 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition"><i class="ph ph-sparkle align-middle"></i> Serendipity</button>
    </nav>

    <!-- ===== Bookshelf ===== -->
    <section id="view-bookshelf" class="view flex-1 flex flex-col">
      <div id="stats" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6"></div>

      <div class="flex flex-col gap-3 mb-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div id="status-filters" class="flex bg-stone-200/60 rounded-full p-1 text-sm max-w-full overflow-x-auto no-scrollbar"></div>
          <div class="flex items-center gap-2 w-full sm:w-auto sm:ml-auto">
            <div class="relative flex-1 sm:flex-none min-w-0">
              <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
              <input id="shelf-search" type="search" placeholder="本棚を検索" class="w-full sm:w-48 bg-white border border-stone-200 rounded-full pl-8 pr-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-stone-300">
            </div>
            <select id="shelf-sort" class="w-32 sm:w-auto shrink-0 bg-white border border-stone-200 rounded-full px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-stone-300">
              <option value="shelf">読み始め順</option>
              <option value="recent">追加が新しい順</option>
              <option value="finished">読了が新しい順</option>
              <option value="genre">ジャンル順</option>
              <option value="title">タイトル順</option>
              <option value="rating">評価順</option>
            </select>
            <div class="flex bg-stone-200/60 rounded-full p-1 shrink-0">
              <button data-view="spine" class="view-btn w-8 h-8 flex items-center justify-center rounded-full transition" title="背表紙"><i class="ph ph-books text-lg"></i></button>
              <button data-view="cover" class="view-btn w-8 h-8 flex items-center justify-center rounded-full transition" title="表紙"><i class="ph ph-squares-four text-lg"></i></button>
            </div>
          </div>
        </div>
        <div id="genre-chips" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div>
      </div>

      <div id="bookshelf-container" class="pb-16"></div>
      <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
        <i class="ph ph-books text-5xl text-stone-300 mb-4"></i>
        <h2 id="empty-title" class="text-lg font-medium mb-2 font-serif-jp">本棚は空です</h2>
        <p id="empty-text" class="text-sm text-stone-500 max-w-md font-serif-jp leading-relaxed">右上の「本を追加」から、<br>あなたの本棚を作り始めましょう。</p>
      </div>
    </section>

    <!-- ===== Phrases ===== -->
    <section id="view-phrases" class="view hidden flex-1 flex-col pb-20">
      <div id="phrase-form-container" class="mb-6 bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-stone-200/70">
        <h3 id="phrase-form-title" class="text-sm font-bold mb-4 flex items-center gap-2"><i class="ph-fill ph-quotes text-lg text-amber-700"></i> 新しいフレーズを記録</h3>
        <form id="phrase-form" class="flex flex-col gap-3">
          <div class="flex flex-col sm:flex-row gap-3">
            <select id="phrase-book-select" class="flex-1 bg-stone-50 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-stone-200"></select>
            <input type="number" id="phrase-page" min="1" placeholder="ページ" class="w-full sm:w-28 bg-stone-50 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-stone-200">
          </div>
          <textarea id="phrase-text" placeholder="心に残ったフレーズや引用を入力..." class="w-full bg-stone-50 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-stone-200 resize-none font-serif-jp h-24 leading-relaxed"></textarea>
          <div class="flex justify-end gap-2">
            <button type="button" id="btn-cancel-phrase" class="hidden px-4 py-2.5 rounded-lg text-sm text-stone-500 hover:bg-stone-100 transition">キャンセル</button>
            <button type="submit" id="btn-add-phrase" class="bg-stone-900 hover:bg-stone-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
              <i class="ph ph-plus-bold"></i><span>記録する</span>
            </button>
          </div>
        </form>
      </div>

      <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
        <div id="phrase-chips" class="flex items-center gap-2 overflow-x-auto no-scrollbar flex-1"></div>
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
          <input id="phrase-search" type="search" placeholder="フレーズを検索" class="w-full sm:w-52 bg-white border border-stone-200 rounded-full pl-8 pr-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-stone-300">
        </div>
      </div>
      <div id="phrases-list" class="columns-1 md:columns-2 gap-5"></div>
      <div id="phrases-empty" class="hidden flex-col items-center justify-center py-16 text-center">
        <i class="ph ph-quotes text-4xl text-stone-300 mb-3"></i>
        <p id="phrases-empty-msg" class="text-sm text-stone-500 font-serif-jp">まだフレーズが記録されていません。</p>
      </div>
    </section>

    <!-- ===== Knowledge Map ===== -->
    <section id="view-mapping" class="view hidden flex-1 flex-col h-[calc(100vh-200px)] min-h-[500px]">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
        <p id="map-hint" class="text-sm text-stone-500">本と本を線で結び、あなただけの「思考の星座」を描きましょう。</p>
        <div class="flex items-center gap-2 ml-auto">
          <button id="btn-export-map" class="text-sm font-medium px-4 py-2 rounded-full bg-white border border-stone-200 hover:bg-stone-50 transition flex items-center gap-1.5">
            <i class="ph ph-download-simple text-lg"></i><span class="hidden sm:inline">画像保存</span>
          </button>
          <button id="btn-connect-mode" class="text-sm font-medium px-4 py-2 rounded-full bg-slate-800 text-white hover:bg-slate-700 transition flex items-center gap-2">
            <i class="ph ph-git-merge text-lg"></i><span>Connect: OFF</span>
          </button>
        </div>
      </div>
      <div id="map-container" class="relative flex-1 bg-space rounded-2xl overflow-auto shadow-inner cursor-grab">
        <div id="map-content" class="relative min-w-[1000px] min-h-[600px]">
          <div id="map-grid" class="absolute inset-0 pointer-events-none"></div>
          <svg id="map-svg" class="absolute inset-0 w-full h-full"></svg>
          <div id="map-nodes" class="absolute inset-0 w-full h-full pointer-events-none"></div>
        </div>
      </div>
    </section>

    <!-- ===== Serendipity ===== -->
    <section id="view-serendipity" class="view hidden flex-1 flex-col h-[calc(100vh-200px)] min-h-[500px] relative overflow-hidden bg-serendipity rounded-2xl border border-stone-200/70 shadow-inner">
      <canvas id="serendipity-canvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>
      <div id="serendipity-container" class="absolute inset-0 w-full h-full z-10"></div>
      <div id="serendipity-empty" class="hidden absolute inset-0 flex-col items-center justify-center text-center z-20">
        <i class="ph ph-sparkle text-4xl text-stone-300 mb-3"></i>
        <p class="text-sm text-stone-500 font-serif-jp mb-2">まだフレーズが記録されていません。</p>
        <p class="text-xs text-stone-400">フレーズを追加して、インスピレーションの海を漂わせましょう。</p>
      </div>
      <div class="absolute bottom-4 right-4 z-30 flex items-center gap-2">
        <button id="btn-shuffle" class="text-xs font-medium text-stone-700 bg-white/85 hover:bg-white px-3 py-1.5 rounded-full backdrop-blur border border-stone-200 shadow-sm flex items-center gap-1.5 transition">
          <i class="ph ph-shuffle"></i> シャッフル
        </button>
      </div>
    </section>
  </main>

  <!-- ===== Book Modal ===== -->
  <div id="modal" class="fixed inset-0 z-50 hidden justify-center items-start sm:items-center bg-stone-900/40 backdrop-blur-sm overflow-y-auto sm:p-6">
    <div id="modal-panel" class="modal-panel bg-white w-full sm:max-w-3xl sm:rounded-2xl shadow-2xl relative min-h-screen sm:min-h-0 my-auto">
      <button id="btn-close-modal" class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-full bg-stone-100 text-stone-500 hover:bg-stone-200 transition z-10" aria-label="閉じる">
        <i class="ph ph-x text-lg"></i>
      </button>

      <div class="grid md:grid-cols-[250px_1fr]">
        <!-- 左 -->
        <aside class="bg-stone-50 p-6 pt-10 flex flex-col items-center gap-4 md:border-r border-stone-100 sm:rounded-tl-2xl md:rounded-bl-2xl">
          <div id="detail-cover" class="w-36 md:w-44"></div>

          <div id="cover-tools" class="w-full">
            <button id="btn-cover-toggle" class="w-full text-xs text-stone-500 hover:text-stone-900 flex items-center justify-center gap-1.5 py-1 transition">
              <i class="ph ph-image"></i> 表紙を変更
            </button>
            <div id="cover-edit" class="hidden mt-2 space-y-2">
              <input type="text" id="detail-cover-url" placeholder="画像URLを貼り付け" class="w-full bg-white border border-stone-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-stone-200">
              <div class="flex gap-2">
                <label class="flex-1 cursor-pointer text-center text-xs bg-white border border-stone-200 hover:bg-stone-100 rounded-lg py-2 transition">
                  <i class="ph ph-upload-simple"></i> 写真から選ぶ
                  <input type="file" id="detail-cover-file" accept="image/*" class="hidden">
                </label>
                <button id="btn-cover-clear" class="text-xs text-stone-500 hover:text-red-600 px-2 transition">外す</button>
              </div>
              <p class="text-[10px] text-stone-400 leading-relaxed">表紙がないときは、タイトルから自動で装丁を作ります。</p>
            </div>
          </div>

          <div class="w-full">
            <label class="block text-xs font-medium text-stone-400 mb-1.5">ステータス</label>
            <div id="status-seg" class="grid grid-cols-3 bg-stone-200/60 rounded-lg p-1 text-xs font-medium">
              <button data-status="wish" class="py-1.5 rounded-md transition">読みたい</button>
              <button data-status="reading" class="py-1.5 rounded-md transition">読書中</button>
              <button data-status="read" class="py-1.5 rounded-md transition">読了</button>
            </div>
          </div>

          <div id="progress-block" class="w-full hidden">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-stone-400">進み具合</label>
              <span id="progress-label" class="text-xs font-medium text-stone-600"></span>
            </div>
            <input type="range" id="detail-current-range" min="0" max="250" value="0" class="w-full">
            <div class="flex items-center gap-2 mt-1">
              <input type="number" id="detail-current" min="0" class="w-20 bg-white border border-stone-200 rounded-lg p-1.5 text-xs outline-none">

        <!-- 右 -->
        <section class="p-6 flex flex-col gap-4">

          <div class="flex items-center justify-between pt-3 border-t border-stone-100">
            <label class="text-xs font-medium text-stone-400">評価と感想</label>
            <div id="detail-stars" class="flex items-center gap-1 text-xl"></div>
          </div>
          <textarea id="detail-memo" placeholder="感想やメモを記録..." class="w-full bg-stone-50 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-stone-200 resize-none font-serif-jp min-h-[130px] leading-relaxed"></textarea>

          <div id="detail-phrases-wrap" class="pt-3 border-t border-stone-100">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-medium text-stone-400 flex items-center gap-1"><i class="ph-fill ph-quotes text-amber-700"></i> この本のフレーズ</label>
              <span id="detail-phrases-count" class="text-xs text-stone-400"></span>
